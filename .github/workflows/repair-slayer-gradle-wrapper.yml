name: Repair Slayer Android Gradle Wrapper

on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-slayer-gradle-wrapper.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Android project branch
        uses: actions/checkout@v4
        with:
          ref: slayer-login-apk-v1
          persist-credentials: true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Gradle wrapper 8.7
        working-directory: slayer-login-android
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin
      - name: Commit generated wrapper to project branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add slayer-login-android/gradlew slayer-login-android/gradlew.bat slayer-login-android/gradle/wrapper/gradle-wrapper.jar slayer-login-android/gradle/wrapper/gradle-wrapper.properties
          git diff --cached --quiet && exit 0
          git commit -m 'Add missing Gradle wrapper for Android Studio imports'
          git push origin HEAD:slayer-login-apk-v1
