name: Build Slayer Login APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-slayer-login-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout standalone Android project branch
        uses: actions/checkout@v4
        with:
          ref: slayer-login-apk-v1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35 using preinstalled sdkmanager
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          echo "sdkmanager=$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build installable debug APK
        working-directory: slayer-login-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: slayer-login-debug-apk
          path: slayer-login-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
