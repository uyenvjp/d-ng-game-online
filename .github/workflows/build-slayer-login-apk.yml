name: Build Slayer Login Debug APK

on:
  push:
    branches:
      - slayer-login-apk-v1
    paths:
      - 'slayer-login-android/**'
      - '.github/workflows/build-slayer-login-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble debug APK
        working-directory: slayer-login-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: slayer-login-debug-apk
          path: slayer-login-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
